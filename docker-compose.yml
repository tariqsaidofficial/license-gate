version: '3.8'

services:
  db:
    image: 'mysql:9.0.1'
    restart: always
    working_dir: /app
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "sleep 30 && npm run prisma-migrate && npm run start"
    depends_on:
      - db
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOSTNAME}:${MYSQL_PORT}/${MYSQL_DATABASE}"
      NODE_ENV: production
      HEX_USER_ID_OFFSET: 0
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER: ${SMTP_SENDER}
      JWT_SECRET: ${JWT_SECRET}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      SIGN_IN_URL: ${PUBLIC_FRONTEND_URL}/auth/login
      RESET_PASSWORD_URL: ${PUBLIC_FRONTEND_URL}/auth/password
      CORS_ORIGIN: ${PUBLIC_FRONTEND_URL}
      GOOGLE_AUTH_CLIENT_ID: ${PUBLIC_GOOGLE_AUTH_CLIENT_ID}
      DISABLE_RECAPTCHA: ${PUBLIC_DISABLE_RECAPTCHA}
      DISABLE_SIGN_UP: ${PUBLIC_DISABLE_SIGN_UP}
    networks:
      - caddy
      - internal
    labels:
      caddy: ${BACKEND_FQDN}
      caddy.reverse_proxy: "{{upstreams http 3000}}"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=${PUBLIC_BACKEND_URL}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: ${FRONTEND_FQDN}
      caddy.reverse_proxy: "{{upstreams http 5000}}"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    ports:
      - 80:80
      - 443:443
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
    networks:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    restart: unless-stopped

volumes:
  db_data:
  caddy_data: {}

networks:
  caddy:
    external: true
  internal:
