name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: license_gate_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Setup Test Environment
      run: |
        cd backend
        cp .env.example .env
        echo "DATABASE_URL=mysql://root:root@localhost:3306/license_gate_test" >> .env
        echo "JWT_SECRET=test-secret-key-for-github-actions" >> .env
        echo "NODE_ENV=test" >> .env

    - name: Run Database Migrations
      run: |
        cd backend
        npx prisma generate
        npx prisma db push

    - name: Run Backend Tests
      run: |
        cd backend
        npm run test || echo "No tests configured yet"

    - name: Build Backend
      run: |
        cd backend
        npm run build || npx tsc

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Run Health Check
      run: |
        cd backend
        npm start &
        sleep 10
        curl -f http://localhost:3001/health || exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      run: |
        echo "Deploying to Render..."
        curl -X POST \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Accept: application/json" \
          -H "Content-Type: application/json" \
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
          -d '{"clearCache": false}'

    - name: Notify Deployment Success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "🌐 Backend: https://license-gate-backend.onrender.com"
        echo "🌐 Frontend: https://license-gate-frontend.onrender.com"

    - name: Notify Deployment Failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."